<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>phone frame (dev)</title>
<style>body{margin:0;background:#02050a}iframe{border:0;display:block}</style></head>
<body><iframe id="f"></iframe>
<script>
  // /phone-frame.html?w=390&h=844&shot=play → the game at phone size with touch controls
  var q = new URLSearchParams(location.search), f = document.getElementById('f');
  f.style.width = (q.get('w') || 390) + 'px'; f.style.height = (q.get('h') || 844) + 'px';
  f.src = '/?shot=' + (q.get('shot') || 'mobile') + '&touch=1';
</script></body></html>
